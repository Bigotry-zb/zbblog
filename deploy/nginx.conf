# /etc/nginx/conf.d/zbblog.conf
# 静态博客 Nginx 配置。替换 your-domain.com 为你的域名。
# 上传静态文件到 /var/www/zbblog 后：nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    root /var/www/zbblog;
    index index.html;

    # 访问日志
    access_log /var/log/nginx/zbblog.access.log;
    error_log  /var/log/nginx/zbblog.error.log;

    # 静态博客路由：/about/ -> /about/index.html，/blog/x -> /blog/x/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # 带 hash 的静态资源长缓存
    location ~* \.(css|js|svg|woff2?|png|jpe?g|gif|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML 不缓存，保证发新文章后立刻可见
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml application/json
        application/javascript application/xml+rss
        image/svg+xml;

    # 自定义 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
