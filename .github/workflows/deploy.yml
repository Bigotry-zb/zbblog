name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Upload and extract
        env:
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          TARGET: ${{ secrets.SERVER_TARGET }}
        run: |
          set -e
          OPTS="-i $HOME/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3"
          echo "== 测试 SSH 连接 =="
          ssh $OPTS "$SSH_USER@$SSH_HOST" "echo SSH OK; df -h / | tail -1"
          echo "== 打包 =="
          tar -czf /tmp/zbblog-dist.tar.gz -C dist .
          ls -lh /tmp/zbblog-dist.tar.gz
          echo "== 上传 =="
          scp $OPTS /tmp/zbblog-dist.tar.gz "$SSH_USER@$SSH_HOST:/tmp/zbblog-dist.tar.gz"
          echo "== 解压到 $TARGET =="
          ssh $OPTS "$SSH_USER@$SSH_HOST" "mkdir -p '$TARGET' && tar -xzf /tmp/zbblog-dist.tar.gz -C '$TARGET' && rm -f /tmp/zbblog-dist.tar.gz && echo DONE"
